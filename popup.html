<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Grok Imagine Bulk Actions</title>
  <style>
    * { box-sizing: border-box; margin:0; padding:0; }
    body {
      width: 320px;
      background: #0a0a0a;
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }
    .header {
      padding: 16px 18px;
      border-bottom: 1px solid #2a2a2a;
      background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
    }
    .title { font-size: 16px; font-weight: 650; letter-spacing: -0.3px; }
    .subtitle { margin-top: 4px; font-size: 12px; color: #8a8a8a; line-height: 1.35; }
    .body {
      padding: 16px 18px 18px;
      display: flex;
      flex-direction: column;
    }
    .btn {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #2a2a2a;
      background: #141414;
      color: #e5e5e5;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .03s ease, background .12s ease, border-color .12s ease, opacity .12s ease;
      text-align: left;
    }
    .btn:active { transform: translateY(1px); }
    .btn:hover { background: #181818; border-color: #3a3a3a; }
    .btn + .btn { margin-top: 10px; }
    .btn[disabled] { opacity: 0.45; cursor: not-allowed; }
    .limit-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      margin-bottom: 10px;
    }
    .limit-btn {
      flex: 1;
      padding: 7px 0;
      border-radius: 8px;
      border: 1px solid #2a2a2a;
      background: #101010;
      color: #b8b8b8;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background .12s ease, border-color .12s ease, opacity .12s ease;
      text-align: center;
    }
    .limit-btn:hover { background: #171717; border-color: #3a3a3a; color: #e5e5e5; }
    .limit-btn[disabled] { opacity: 0.45; cursor: not-allowed; }
    #downloadAll { order: 1; }
    #unfavoriteAll { order: 2; }
    #unfavoriteLimits { order: 3; }
    #deleteAllFiles { order: 4; }
    #deleteFileLimits { order: 5; }
    #status { order: 6; }
    .hint:last-of-type { order: 7; }
    .hint {
      margin-top: 14px;
      font-size: 12px;
      color: #9a9a9a;
      line-height: 1.45;
      padding: 10px 12px;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
    }
    .hint b { color: #e5e5e5; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">Grok Imagine Bulk Actions</div>
    <div class="subtitle">API-only mode: Download, unfavorite + delete posts, and delete files.</div>
  </div>

  <div class="body">
    <button id="downloadAll" class="btn">⬇️ Download All</button>
    <button id="unfavoriteAll" class="btn">💔 Unfavorite + Delete All</button>
    <button id="deleteAllFiles" class="btn">🗑️ Delete All Files</button>
    <div id="unfavoriteLimits" class="limit-row">
      <button id="unfavoriteAllLimit100" class="limit-btn">100</button>
      <button id="unfavoriteAllLimit500" class="limit-btn">500</button>
      <button id="unfavoriteAllLimit1000" class="limit-btn">1000</button>
    </div>
    <div id="deleteFileLimits" class="limit-row">
      <button id="deleteAllFilesLimit100" class="limit-btn">100</button>
      <button id="deleteAllFilesLimit500" class="limit-btn">500</button>
      <button id="deleteAllFilesLimit1000" class="limit-btn">1000</button>
    </div>
    <div id="status" class="hint" style="display:none; margin-top:10px;"></div>

    <div class="hint">
      Post actions work on <b>grok.com/imagine/*</b> pages (including <b>/imagine/saved</b>).<br/>
      Files deletion works on <b>grok.com/files</b>.<br/>
      Actions run in-page and show a progress modal.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
